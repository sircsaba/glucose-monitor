name: glucose_monitor
description: Glucose monitor and night alarm app that reads a Nightscout site.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8
  battery_plus: ^6.0.3
  crypto: ^3.0.5
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: assets/icon/icon_fg.png
