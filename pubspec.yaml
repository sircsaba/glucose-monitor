name: glucose_monitor
description: Glucose monitor and night alarm app that reads a Nightscout site.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8
  battery_plus: ^6.0.3
  crypto: ^3.0.5
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  image: ^4.2.0
  zxing2: ^0.2.3
  zxing_lib: ^1.1.4
  mobile_scanner: ^7.4.2
  google_mlkit_text_recognition: ^0.17.1
  archive: any
  file_picker: '>=8.1.0 <10.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/cnf.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: assets/icon/icon_fg.png
