name: Loop compile check (no signing)

on:
  push:
    branches: [loop-check]

jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - name: Newest Xcode
        run: |
          X=/Applications/Xcode_27.0.app
          echo "::notice::$X"
          sudo xcode-select --switch "$X/Contents/Developer"
      - uses: actions/checkout@v5
        with:
          repository: sircsaba/LoopWorkspace
          ref: shared-foods-check
          submodules: recursive
      - name: Patches, as in the real build
        run: |
          run() { if ! out=$("$@" 2>&1); then echo "$out" | tail -8 | while IFS= read -r l; do echo "::error::$1 ... ${l:0:400}"; done; exit 1; fi; }
          run git apply --directory=Loop -v --whitespace=fix ./custom_patches/loop_heartbeat.patch
          run git apply --directory=Loop -v --whitespace=fix ./custom_patches/loop_shared_foods.patch
          run git apply --directory=NightscoutRemoteCGM -v --whitespace=fix ./custom_patches/nightscout_cgm_backup_source.patch
          echo "::notice::patches applied"
      - name: Build Loop (iPhone, no signing)
        run: |
          set +e
          xcodebuild -workspace LoopWorkspace.xcworkspace -scheme LoopWorkspace \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          rc=$?
          grep -E "error:" build.log | sort -u | head -15 | while read -r l; do echo "::error::${l:0:900}"; done
          grep -E "warning: .*(CarbEntryView|CarbEntryViewModel)" build.log | sort -u | head -10 | while read -r l; do echo "::warning::${l:0:600}"; done
          tail -3 build.log | while read -r l; do echo "::notice::tail: ${l:0:500}"; done
          exit $rc
