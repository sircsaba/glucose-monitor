name: Make Monitor Glucose screenshots (demo data)
# Builds the web app (Monitor Glucose and Monitor Glucose Plus), runs it against
# a pretend Nightscout site with invented data (scripts/demo/mock_nightscout.py)
# and takes iPhone, Android and web screenshots. The pictures are put on the
# "screenshots" branch of this repository (screenshots/<set>/<name>.png).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the web project files
        run: flutter create --org com.inforap --project-name glucose_monitor --platforms web .

      - name: Get packages
        run: flutter pub get

      - name: Build Monitor Glucose (web)
        run: |
          APP_NAME="Monitor Glucose" python3 scripts/patch_web.py web
          flutter build web --release --base-href / --dart-define=BUILD=demo
          python3 scripts/patch_web.py build
          mv build/web /tmp/gm

      - name: Build Monitor Glucose Plus (web)
        run: |
          APP_NAME="Monitor Glucose Plus" python3 scripts/patch_web.py web
          flutter build web --release --base-href / --dart-define=BUILD=demo --dart-define=PLUS=true
          python3 scripts/patch_web.py build
          mv build/web /tmp/plus

      - name: Browser for the screenshots
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Take the screenshots
        run: |
          python3 scripts/demo/mock_nightscout.py 8099 &
          python3 -m http.server 8080 --directory /tmp/gm >/dev/null 2>&1 &
          python3 -m http.server 8081 --directory /tmp/plus >/dev/null 2>&1 &
          sleep 3
          python3 scripts/demo/screenshots.py /tmp/shots http://127.0.0.1:8080/ http://127.0.0.1:8081/ http://127.0.0.1:8099

      - name: Put them on the screenshots branch
        run: |
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "Monitor Glucose screenshots"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_number }} (demo data)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
