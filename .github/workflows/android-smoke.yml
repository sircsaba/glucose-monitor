name: Test Monitor Glucose (Android start, emulator)

on:
  workflow_dispatch:
    inputs:
      plus:
        description: 'Monitor Glucose Plus'
        type: boolean
        default: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_NAME: Monitor Glucose Test
      BUNDLE_ID: com.inforap.glucosemonitor.smoke
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.inforap --project-name glucose_monitor --platforms android,ios .
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PW" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "GM_KEYSTORE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "GM_KEYSTORE_PASSWORD=$KS_PW" >> $GITHUB_ENV
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets: this APK will not install over an older one."
          fi

      - run: python3 scripts/patch_platforms.py android
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-x64 --dart-define=PLUS=${{ inputs.plus }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start the app in an emulator and read its log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.inforap.glucosemonitor.smoke -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > logcat.txt || true
            adb exec-out screencap -p > screen.png || true
            grep -E "flutter|AndroidRuntime|FATAL|Exception|E/|glucose" logcat.txt | grep -vE "^.{0,40} (I|D|V) (chatty|Zygote)" | tail -150 > important.txt || true
            grep -iE "flutter.*(error|exception)|FATAL|AndroidRuntime|Unhandled" logcat.txt | tail -30 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log
          path: |
            logcat.txt
            important.txt
            screen.png
