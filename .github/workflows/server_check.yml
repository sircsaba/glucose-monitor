name: Server check
on:
  push:
    branches: [server-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look
        run: |
          mkdir o && cd o
          for i in $(seq 1 14); do
            echo "$(date -u +%FT%TZ) $(curl -s -m 30 'https://bg.inforap.com/api/v1/health?token=readable-val' | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("loopCgmFromHere"), d.get("loopCgmFetch"), d.get("loopLast"))')" >> out.txt
            sleep 60
          done
          git init -q -b check-out && git add . && git -c user.name=ci -c user.email=ci@x commit -qm out && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" check-out
