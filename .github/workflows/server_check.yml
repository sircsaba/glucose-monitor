name: Server check
on:
  push:
    branches: [server-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look
        run: |
          mkdir o && cd o
          for i in 1 2 3; do
            date -u +%FT%TZ >> out.txt
            curl -s -m 30 "https://bg.inforap.com/api/v1/health?token=readable-val" >> out.txt; echo >> out.txt
            sleep 100
          done
          echo "== devicestatus (latest loop)" >> out.txt
          curl -s -m 30 "https://nsval.mooo.com/api/v1/devicestatus.json?count=1&token=readable-val" | head -c 1500 >> out.txt; echo >> out.txt
          echo "== bg logs" >> out.txt
          curl -s -m 30 "https://bg.inforap.com/api/v1/logs?count=30&token=readable-val" | head -c 6000 >> out.txt; echo >> out.txt
          git init -q -b check-out && git add . && git -c user.name=ci -c user.email=ci@x commit -qm out && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" check-out
