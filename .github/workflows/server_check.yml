name: Server check
on:
  push:
    branches: [server-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List zxing2
        run: |
          mkdir p && cd p && printf 'name: p\nenvironment:\n  sdk: ">=3.0.0 <4.0.0"\ndependencies:\n  zxing2: ^0.2.3\n' > pubspec.yaml
          docker run --rm -v $PWD:/p -w /p dart:stable sh -c 'dart pub get >/dev/null && d=$(ls -d /root/.pub-cache/hosted/pub.dev/zxing2-*) && echo $d && ls $d/lib $d/lib/src && grep -rn "^class \(MultiFormatReader\|EAN13Reader\|MultiFormatOneDReader\|UPCAReader\)\|^export" $d/lib | head -40' > out.txt 2>&1
          while read -r l; do echo "::notice::$l"; done < out.txt
