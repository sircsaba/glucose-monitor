name: Build Glucose Monitor (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['cloudflare/**', 'server/**', '**.md']

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ vars.APP_NAME || 'Glucose Monitor' }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.monitorglucose.app' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android and iOS project files
        run: flutter create --org com.monitorglucose --project-name glucose_monitor --platforms android,ios .

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PW" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "GM_KEYSTORE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "GM_KEYSTORE_PASSWORD=$KS_PW" >> $GITHUB_ENV
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets: this APK will not install over an older one."
          fi

      - name: Set app name, ID and permissions
        run: python3 scripts/patch_platforms.py android

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Check the code
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            grep -E "error •|error -" analyze.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK with its version
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "APK_NAME=glucose-monitor-$V-${{ github.run_number }}" >> $GITHUB_ENV
          mv build/app/outputs/flutter-apk/app-release.apk "glucose-monitor-$V-${{ github.run_number }}.apk"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
