name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['cloudflare/**', 'server/**', '**.md']

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ vars.APP_NAME || 'Glucose Monitor' }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.monitorglucose.app' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android and iOS project files
        run: flutter create --org com.monitorglucose --project-name glucose_monitor --platforms android,ios .

      - name: Set app name, ID and permissions
        run: python3 scripts/patch_platforms.py android

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK with its version
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "APK_NAME=glucose-monitor-$V-${{ github.run_number }}" >> $GITHUB_ENV
          mv build/app/outputs/flutter-apk/app-release.apk "glucose-monitor-$V-${{ github.run_number }}.apk"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
