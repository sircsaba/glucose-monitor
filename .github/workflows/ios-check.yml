name: Check Glucose Monitor (iPhone build, no signing)

# Builds the iPhone app and its widget without signing or uploading, to check
# that everything compiles. Nothing is sent to TestFlight.
on:
  workflow_dispatch:

jobs:
  ios-check:
    runs-on: macos-latest
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.monitorglucose.app' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.monitorglucose --project-name glucose_monitor --platforms android,ios .
      - run: python3 scripts/patch_platforms.py ios
      - run: flutter pub get
      - run: flutter build ios --release --config-only --no-codesign --build-number=$BUILD_NUMBER
      - run: if [ -f ios/Podfile ]; then cd ios && pod install; fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec ruby native/ios/add_widget.rb
      - name: Build without signing
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -60
          test ${PIPESTATUS[0]} -eq 0
